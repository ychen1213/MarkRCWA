units: um
geometry:
  kind: rectangle
  pitch_um: 8
  depth_um: 0.12
  duty: 0.5
simulation:
  wavelength_um: 0.633
  polarization: TE
  fourier_order: 55
  na: 0.8
detector:
  mode: coherent
  orders: [-5, -3, -1, 1, 3, 5]
  weights:
    -5: [0.3, 0.1]
    -3: [0.5, 0]
    -1: [1, 0]
    1: [1, 0]
    3: [0.5, 0]
    5: [0.3, -0.1]
  apd_orders: [1, 3, 5]
stage_scan:
  start_um: -4
  stop_um: 4
  samples: 2001
output: outputs/demo_coherent
